services:
  backend:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: laravel_backend
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - app-network

  frontend:
    build:
      context: ../frontend # Sube un nivel para encontrar la carpeta del frontend
      dockerfile: Dockerfile
    container_name: sublimacion_frontend
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ../frontend:/app # Mapea la carpeta hermana del frontend
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - VITE_API_URL=http://127.0.0.1:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:        
      - app-network
  
  nginx:
    image: nginx:alpine
    container_name: nginx_server
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html 
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network: